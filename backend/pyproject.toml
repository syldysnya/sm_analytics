[project]
name = "creator-research"
version = "0.1.0"
description = "Social media analytics for gaming channels: collect YouTube, TikTok and Twitch stats, keep their history, export data for the site."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creator_research"]

[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.envs.default.scripts]
# Code quality.
fmt = ["ruff format .", "ruff check --fix ."]
lint = ["ruff format --check .", "ruff check ."]
typecheck = "mypy src tests"
test = "pytest {args}"
check = ["lint", "typecheck", "test"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ANN"]
